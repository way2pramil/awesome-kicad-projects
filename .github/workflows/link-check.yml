name: Link Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly on Mondays
    - cron: "43 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  awesome-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install awesome_bot
        run: gem install awesome_bot --no-document

      - name: Check links in README.md
        run: |
          awesome_bot README.md \
            --allow-dupe \
            --allow-redirect \
            --allow-timeout \
            --allow-ssl \
            --request-delay 1 \
            --skip-save-results \
            --white-list "github.com/way2pramil/awesome-kicad-projects/stargazers"
